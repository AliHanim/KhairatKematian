<style>
  :root{
    --ink:#20302a;
    --sand:#faf7ee;
    --panel:#ffffff;
    --teal:#1f6f5c;
    --teal-dark:#154c40;
    --gold:#c39a3e;
    --line:#dcd5c2;
    --danger:#a4423a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:32px 16px 80px;
  }
  .sheet{
    max-width:640px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--line);
  }
  header{
    padding:32px 32px 28px;
    text-align:center;
    border-bottom:3px solid var(--teal);
    position:relative;
  }
  .logo{
    width:88px;
    height:88px;
    margin:0 auto 14px;
    display:block;
  }
  header::after{
    content:'';
    position:absolute;
    left:32px; right:32px; bottom:-9px;
    height:1px;
    background:var(--gold);
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:.04em;
    color:var(--teal-dark);
    margin:0 0 6px;
  }
  h1{
    font-family:'Amiri',serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 10px;
    color:var(--teal-dark);
  }
  .surau-name{
    font-family:'Amiri',serif;
    font-style:italic;
    font-size:16px;
    margin:2px 0;
  }
  .lokasi{
    font-size:13.5px;
    color:#5c6b63;
  }
  form{padding:30px 32px 8px;}
  .field{margin-bottom:22px;}
  .field label{
    display:block;
    font-size:14.5px;
    font-weight:600;
    margin-bottom:6px;
  }
  .field-num{
    font-family:'Amiri',serif;
    color:var(--gold);
    margin-right:4px;
  }
  .field .hint{
    font-weight:400;
    color:#7a8880;
    font-size:12.5px;
  }
  input[type=text], input[type=tel], textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid #c7cdc4;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input:focus, textarea:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
    border-color:var(--teal);
  }
  textarea{resize:vertical; min-height:64px;}
  .tel-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  .tel-row div span{
    display:block;
    font-size:12px;
    color:#7a8880;
    margin-bottom:4px;
  }
  .section-title{
    font-size:15px;
    font-weight:700;
    margin:6px 0 4px;
    color:var(--teal-dark);
  }
  .section-title .num{
    display:inline-block;
    font-family:'Amiri',serif;
    color:var(--gold);
    margin-right:4px;
  }
  .tanggungan-note{
    font-size:12.5px;
    color:#7a8880;
    margin:0 0 12px;
  }
  .table-wrap{
    overflow-x:auto;
    margin-bottom:8px;
    -webkit-overflow-scrolling:touch;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:640px;
  }
  th{
    background:#f1efe4;
    font-size:12px;
    font-weight:600;
    text-align:left;
    padding:8px 6px;
    border:1px solid var(--line);
    color:var(--teal-dark);
  }
  td{
    border:1px solid var(--line);
    padding:4px;
  }
  td.bil{
    text-align:center;
    font-size:13px;
    color:#7a8880;
    width:30px;
  }
  td input{
    border:none;
    padding:7px 6px;
    font-size:13.5px;
    min-width:70px;
  }
  td input:focus{outline:none; background:#f4f9f7;}
  td.nama input{min-width:140px;}
  td.alamat-td input{min-width:110px;}
  select.jantina{
    width:100%;
    border:none;
    padding:7px 4px;
    font-size:13.5px;
    background:#fff;
    font-family:'Inter',sans-serif;
  }
  .agree{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:#f6f4ea;
    border:1px solid var(--line);
    padding:14px 16px;
    margin:26px 0 20px;
    font-size:13.5px;
    line-height:1.5;
  }
  .agree input{margin-top:3px;}
  button{
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:14px;
    font-size:15.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-bottom:8px;
  }
  button:hover{background:var(--teal-dark);}
  button:disabled{background:#9aa89f; cursor:not-allowed;}
  .status{
    text-align:center;
    font-size:14px;
    padding:10px 0 26px;
    min-height:20px;
  }
  .status.ok{color:var(--teal-dark); font-weight:600;}
  .status.err{color:var(--danger); font-weight:600;}
  .required::after{
    content:' *';
    color:var(--danger);
  }
</style>
</head>
<body>

    <p class="eyebrow">BORANG KEAHLIAN</p>
    <h1>Tabung Khairat Kematian</h1>
    <p class="surau-name">Surau Al-Ansar, Taman Coral Heights, Sikamat</p>
    <p class="lokasi">Seremban, Negeri Sembilan</p>
  </header>

  <form id="khairatForm">
    <div class="field">
      <label class="required" for="namaPenuh"><span class="field-num">1.</span>Nama Penuh</label>
      <input type="text" id="namaPenuh" required>
    </div>

    <div class="field">
      <label class="required" for="noKP"><span class="field-num">2.</span>No. Kad Pengenalan</label>
      <input type="text" id="noKP" placeholder="cth: 800101-05-1234" required>
    </div>

    <div class="field">
      <label><span class="field-num">3.</span>No. Telefon</label>
      <div class="tel-row">
        <div><span>Rumah (R)</span><input type="tel" id="telR" placeholder="cth: 06-7651234"></div>
        <div><span>Bimbit (H/P)</span><input type="tel" id="telHP" placeholder="cth: 012-3456789"></div>
        <div><span>Pejabat (Pej)</span><input type="tel" id="telPej" placeholder="cth: 03-89261234"></div>
      </div>
    </div>

    <div class="field">
      <label class="required" for="alamat"><span class="field-num">4.</span>Alamat Rumah</label>
      <textarea id="alamat" required></textarea>
    </div>

    <div class="field">
      <p class="section-title"><span class="num">5.</span>Tanggungan Saya</p>
      <p class="tanggungan-note">Senaraikan tanggungan anda. Baris yang tidak digunakan boleh dibiarkan kosong.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:30px;">Bil</th>
              <th>Nama</th>
              <th>No. KP</th>
              <th style="width:80px;">Jantina</th>
              <th style="width:60px;">Umur</th>
              <th>Pertalian</th>
            </tr>
          </thead>
          <tbody id="tanggunganBody"></tbody>
        </table>
      </div>
    </div>

    <label class="agree">
      <input type="checkbox" id="agree" required>
      <span>Saya dengan ini bersetuju menyertai Tabung Khairat Kematian Surau Al-Ansar, Taman Coral Heights mengikut <a href="https://drive.google.com/file/d/1KtQbW7ht3qla-gjbZ2dX2IHlr-BnBcD9/view?usp=drive_link" target="_blank" rel="noopener" style="color:var(--teal-dark); font-weight:600;">peraturan-peraturan yang ditetapkan</a>.</span>
    </label>

    <button type="submit" id="submitBtn">Hantar Borang</button>
    <p class="status" id="status"></p>
  </form>
</div>

<script>
  // Paste your deployed Apps Script Web App URL here after deployment.
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzzl1QX9YNeOdnbfFGzoTl2AYM-u0kQ-FRmWd3tyittpBB1JogNm71eBvonMLfDT2XF/exec';

  const tbody = document.getElementById('tanggunganBody');
  for (let i = 1; i <= 10; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="bil">' + i + '</td>' +
      '<td class="nama"><input type="text" data-field="nama"></td>' +
      '<td><input type="text" data-field="noKP" placeholder="800101-05-1234"></td>' +
      '<td><select class="jantina" data-field="jantina">' +
        '<option value=""></option>' +
        '<option value="L">L</option>' +
        '<option value="P">P</option>' +
      '</select></td>' +
      '<td><input type="text" data-field="umur" inputmode="numeric"></td>' +
      '<td class="alamat-td"><input type="text" data-field="pertalian"></td>';
    tbody.appendChild(tr);
  }

  document.getElementById('khairatForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    if (GAS_URL.indexOf('PASTE_YOUR_WEB_APP_URL_HERE') !== -1) {
      status.textContent = 'Sila pasang GAS_URL dalam kod dahulu (lihat arahan deployment).';
      status.className = 'status err';
      return;
    }

    const tanggungan = Array.from(tbody.querySelectorAll('tr')).map(function (tr, idx) {
      const get = function (f) { return tr.querySelector('[data-field="' + f + '"]').value.trim(); };
      return {
        bil: idx + 1,
        nama: get('nama'),
        noKP: get('noKP'),
        jantina: get('jantina'),
        umur: get('umur'),
        pertalian: get('pertalian')
      };
    });

    const payload = {
      namaPenuh: document.getElementById('namaPenuh').value.trim(),
      noKP: document.getElementById('noKP').value.trim(),
      telR: document.getElementById('telR').value.trim(),
      telHP: document.getElementById('telHP').value.trim(),
      telPej: document.getElementById('telPej').value.trim(),
      alamat: document.getElementById('alamat').value.trim(),
      tanggungan: tanggungan
    };

    btn.disabled = true;
    btn.textContent = 'Menghantar...';
    status.textContent = '';
    status.className = 'status';

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.status === 'ok') {
          status.textContent = 'Borang berjaya dihantar. ID Ahli: ' + data.idAhli;
          status.className = 'status ok';
          document.getElementById('khairatForm').reset();
        } else {
          throw new Error(data.message || 'Ralat tidak diketahui');
        }
      })
      .catch(function (err) {
        status.textContent = 'Gagal menghantar borang: ' + err.message;
        status.className = 'status err';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Hantar Borang';
      });
  });
</script>
</body>
</html>
